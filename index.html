<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07264a">
<title>2026 日本夏日旅行｜互動地圖</title>
<meta name="description" content="岡山、廣島、九州 2026 夏日自助旅行互動地圖。點選城市閱讀 54 頁行程筆記。">
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;color:#133052;background:#e9f3f5;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}a{color:#086da0}a:hover{text-decoration:none}
.topbar{position:sticky;top:0;z-index:30;background:rgba(7,33,64,.96);backdrop-filter:blur(14px);color:#fff;box-shadow:0 4px 20px #001a3330}.topinner{max-width:1470px;margin:auto;padding:12px 21px;display:flex;align-items:center;gap:15px;flex-wrap:wrap}.brand{font-weight:900;font-size:20px;letter-spacing:.05em}.small{font-size:12px;color:#bad5e5}.topactions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.topactions a,.topactions button{background:#ffffff18;color:#fff;border:1px solid #ffffff38;padding:9px 12px;text-decoration:none;border-radius:99px;font-weight:700;font-size:13px}.topactions a:hover,.topactions button:hover{background:#ffffff30}
.layout{max-width:1450px;display:grid;grid-template-columns:minmax(400px,740px) minmax(370px,1fr);gap:20px;padding:20px;margin:auto;align-items:start}.map-card{position:relative;overflow:hidden;border-radius:19px;box-shadow:0 12px 36px #27577928;border:7px solid white;background:#9bd6ec}.poster{width:100%;display:block}.map-hint{position:absolute;top:8px;left:9px;background:#062b54d9;color:white;font-size:12px;padding:7px 10px;border-radius:99px;pointer-events:none}.hotspot{position:absolute;transform:translate(-50%,-50%);width:17%;aspect-ratio:1;border-radius:50%;border:3px solid transparent;background:transparent;transition:border-color .18s,box-shadow .18s,transform .18s;outline-offset:4px;z-index:2}.hotspot:after{content:'➜';position:absolute;right:-23%;top:-17%;font-size:clamp(17px,3vw,29px);color:#fff6a0;transform:rotate(105deg);filter:drop-shadow(0 2px 3px #0b3b60);opacity:0;transition:opacity .2s;pointer-events:none}.hotspot:hover,.hotspot:focus-visible,.hotspot.active{border-color:#fff8a8;box-shadow:0 0 0 5px #ffe26875,0 0 22px 12px #ffec83dd,inset 0 0 15px #fff9c3;transform:translate(-50%,-50%) scale(1.045)}.hotspot:hover:after,.hotspot:focus-visible:after,.hotspot.active:after{opacity:1}.hotspot .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.panel{position:sticky;top:90px;background:#ffffffed;border:1px solid #d4e6ed;border-radius:18px;box-shadow:0 9px 32px #26527925;max-height:calc(100vh - 108px);overflow:auto}.panel-header{position:sticky;top:0;z-index:4;background:linear-gradient(135deg,#093761,#086b9b);color:#fff;padding:19px 21px}.eyebrow{font-size:12px;letter-spacing:.12em;color:#bde9fe;font-weight:800}.titleline{display:flex;align-items:center;gap:10px}.panel h1{font-size:clamp(22px,2.3vw,29px);margin:5px 0}.date{border-radius:100px;background:#ffffff24;padding:5px 10px;font-size:12px;white-space:nowrap}.summary{font-size:14px;line-height:1.7;color:#dff6ff;margin:7px 0 0}.panel-body{padding:17px 20px 30px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:17px}.chip{background:#e8f4fa;color:#235b7d;padding:6px 10px;border-radius:100px;font-size:12px;font-weight:700}.section-title{font-size:15px;margin:21px 0 11px;color:#123e63}.day{border-left:3px solid #41a0c7;padding:0 0 10px 13px;margin:11px 0;line-height:1.7}.day strong{display:inline-block;color:#0a5c86;margin-bottom:3px}.tip{background:#fff7db;border-left:4px solid #e9ad31;border-radius:8px;padding:12px;font-size:13px;line-height:1.7;margin:15px 0}.tabs{display:flex;gap:7px;margin:15px 0;flex-wrap:wrap}.tab{background:#edf4f7;color:#2c5874;padding:9px 13px;border:0;border-radius:9px;font-size:13px;font-weight:800}.tab[aria-selected=true]{background:#0b5e92;color:white}.pages{display:grid;gap:8px}.sourcepage{border:1px solid #d7e5ec;border-radius:10px;overflow:hidden;background:#fff}.sourcepage summary{cursor:pointer;padding:11px 13px;background:#f0f7fa;font-weight:750;display:flex;justify-content:space-between;gap:8px}.sourcepage pre{font-family:inherit;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;padding:15px;margin:0;color:#263b4c}.sourcepage a{font-size:12px;white-space:nowrap}.source-meta{font-size:12px;color:#53718a;line-height:1.7}.source-meta strong{color:#174d74}.pdfbutton{display:inline-flex;background:#0e6495;color:white!important;padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:800;font-size:13px;margin:8px 6px 0 0}.outlinebutton{background:white;color:#0e6495!important;border:1px solid #9ac9df}.search{width:100%;margin:10px 0;border:1px solid #bed9e7;border-radius:9px;padding:12px 14px;outline-color:#0e7fb1}.results{font-size:13px}.results button{display:block;width:100%;text-align:left;background:#f2f8fb;border:1px solid #d9ecf2;border-radius:9px;margin:7px 0;padding:10px;color:#234b65}.results small{display:block;color:#53758a;margin-top:4px}.footer{max-width:1450px;margin:0 auto 22px;padding:0 25px;color:#51728a;font-size:12px;line-height:1.7}.mobile-select{display:none}.notice{background:#f0f8fb;padding:14px;border-radius:10px;line-height:1.8;font-size:13px}.place-list{display:flex;gap:7px;flex-wrap:wrap}.place-list a{font-size:12px;padding:7px 9px;border:1px solid #b2d8e9;border-radius:8px;background:#eff9fc;text-decoration:none;font-weight:700}.page-visible{margin:13px 0;border:1px solid #d3e7ef;border-radius:11px;overflow:hidden}.page-visible .head{padding:12px;background:#e9f5fa;font-weight:800;color:#164f73}.page-visible .raw{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;padding:14px}.page-visible .raw a{font-weight:700;text-decoration:underline}.fresh{border:2px solid #63b3af;background:#e9f8f3;border-radius:11px;padding:14px;line-height:1.85;margin:15px 0;white-space:pre-wrap}.close{display:none}
@media(max-width:950px){.layout{display:block;padding:10px;max-width:680px}.map-card{border-width:4px}.panel{position:fixed;z-index:20;left:0;right:0;top:auto;bottom:0;border-radius:20px 20px 0 0;max-height:77vh;box-shadow:0 -8px 45px #001b4173;transform:translateY(110%);transition:transform .28s}.panel.open{transform:translateY(0)}.close{display:block;margin-left:auto;background:#ffffff30;border:1px solid #ffffff60;color:white;border-radius:100px;width:33px;height:33px}.footer{text-align:center}.map-hint{font-size:11px}.mobile-select{display:flex;position:sticky;bottom:10px;justify-content:center;margin:9px}.mobile-select button{background:#073d67;color:white;border:0;border-radius:99px;padding:11px 18px;box-shadow:0 5px 15px #092b4460;font-weight:800}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="topbar"><div class="topinner"><div><div class="brand">🇯🇵 2026 日本夏日旅行</div><div class="small">7/14–7/29 · 岡山、廣島與九州 · 最後一天宮崎直達福岡</div></div><div class="topactions"><button id="overview">🗺 全部城市</button><button id="searchBtn">⌕ 搜尋行程</button><button id="prepBtn">🧳 行前準備</button></div></div></header>
<main class="layout"><div><div class="map-card" id="map"><img class="poster" src="assets/map-clean.jpg" alt="2026 日本夏日旅行水彩地圖，含岡山、廣島、宮島、門司港、長崎、宮崎、鹿兒島圓形景點插畫"/><div class="map-hint">✨ 移到圓形景點上會發光，點擊查看行程</div><div id="hotspots"></div></div><div class="mobile-select"><button id="mobileOpen">☰ 查看城市資訊</button></div></div><section class="panel" id="panel" aria-label="城市行程資訊"><div class="panel-header"><div class="eyebrow">2026 TRAVEL JOURNAL · JAPAN</div><div class="titleline"><h1 id="cityName">互動旅遊地圖</h1><span class="date" id="cityDate"></span><button class="close" id="close" aria-label="關閉資訊">✕</button></div><p class="summary" id="cityIntro">點選地圖上的圓形縮圖，查看行程內容。</p></div><div class="panel-body" id="content"></div></section></main>
<footer class="footer">資料以你提供的《2026 Japan》PDF 為準。本站已依最新指示取消高千穗相關路線，7/29 直接宮崎返回福岡。原始筆記中的其他備案與可能重複內容保留。時刻、價格、營業資訊與預約狀態，出發前請另向官方確認。</footer>
<script>
'use strict';
let DATA=null, selected=null, tab='highlights', query='';const $=id=>document.getElementById(id);const mobile=()=>matchMedia('(max-width:950px)').matches;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gmap=s=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s+', 日本');
let locationTerms=[],locationRE=null;
function initializeLocations(){locationTerms=[...new Set(DATA.regions.flatMap(r=>r.locations||[]))].sort((a,b)=>b.length-a.length);locationRE=new RegExp(locationTerms.map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g')}
function toLinks(s){return String(s).split(/(https?:\/\/[^\s<>]+)/g).map((part,i)=>{if(i%2)return `<a href="${escapeHTML(part)}" target="_blank" rel="noopener noreferrer">${escapeHTML(part)}</a>`;return escapeHTML(part).replace(locationRE,name=>`<a href="${gmap(name)}" target="_blank" rel="noopener noreferrer" title="Google Maps 搜尋 ${escapeHTML(name)}">📍${escapeHTML(name)}</a>`)}).join('')}
function directPages(r){return pageList(r).map(p=>`<section class="page-visible" id="pdf-${p.number}"><div class="head">📖 PDF 第 ${p.number} 頁 · 詳細行程（直接展開）</div><div class="raw">${toLinks(p.text)}</div></section>`).join('')}
function locationList(r){return `<div class="place-list">${(r.locations||[]).map(v=>`<a href="${gmap(v)}" target="_blank" rel="noopener noreferrer">📍 ${escapeHTML(v)} ↗</a>`).join('')}</div>`}

function pageList(r){return r.pages.map(n=>DATA.pages[n-1]).filter(Boolean)}
function renderHotspots(){ $('hotspots').innerHTML='';for(const r of DATA.regions){const b=document.createElement('button');b.className='hotspot'+(r.id===selected?' active':'');b.style.left=(r.point[0]*100)+'%';b.style.top=(r.point[1]*100)+'%';b.setAttribute('aria-label',`查看${r.name}的行程`);b.title=`${r.name}｜${r.period}`;b.innerHTML=`<span class="sr">${escapeHTML(r.name)}</span>`;b.onclick=()=>choose(r.id);$('hotspots').appendChild(b)}}
function choose(id){selected=id;tab='highlights';renderHotspots();render();if(mobile())$('panel').classList.add('open')}
function chooseTab(v){tab=v;render()}
function render(){let r=DATA.regions.find(x=>x.id===selected);if(!r){$('cityName').textContent='旅行路線總覽';$('cityDate').textContent='7 個景點群';$('cityIntro').textContent='點擊地圖上任一圓形景點，即可開啟這個地區的行程與原始 PDF 資訊。';$('content').innerHTML='<div class="notice">從岡山開始，依序造訪廣島、宮島、小倉／門司港、長崎、鹿兒島、宮崎，最後直接返回福岡。下方可搜尋完整 PDF 的文字內容。</div>'+allCities();return}
 $('cityName').textContent=r.name;$('cityDate').textContent=r.period;$('cityIntro').textContent=r.intro;
 let html=`<div class="chips">${r.chips.map(c=>`<span class="chip">${escapeHTML(c)}</span>`).join('')}</div><h2 class="section-title">🗓 每日行程</h2>${r.days.map(d=>`<div class="day"><strong>${escapeHTML(d[0])}</strong><div>${escapeHTML(d[1])}</div></div>`).join('')}<div class="tip">⚠️ <strong>注意事項：</strong>${escapeHTML(r.tip)}</div>`;
 if(r.extra)html+=`<section class="fresh"><strong>🚗 已更新的最後一天</strong>\n${toLinks(r.extra)}</section>`;
 html+=`<h2 class="section-title">📍 景點、餐廳與交通地點（點擊直達 Google Maps）</h2>${locationList(r)}<h2 class="section-title">📚 全部行程細節與提醒</h2><p class="source-meta">下面直接展示 PDF 所有相關頁面的詳細原文，包含每站玩法、時間、交通、吃什麼、必備事項及注意提醒。部分 PDF 換行會保留；點擊正文中的 📍 地點可開啟 Google Maps。原稿中的備案不等於已確認行程。</p>${directPages(r)}`;
 html+=`<h2 class="section-title">🔎 搜尋所有行程資訊</h2><input id="search" class="search" type="search" placeholder="搜尋：砂浴、軍艦島、交通、咖啡…" value="${escapeHTML(query)}"><div id="searchResults" class="results"></div>`;
 $('content').innerHTML=html;$('search').addEventListener('input',e=>{query=e.target.value;searchResults()});searchResults();}
function allCities(){return `<h2 class="section-title">全部目的地</h2><div class="results">${DATA.regions.map(r=>`<button data-city="${r.id}"><strong>${escapeHTML(r.name)}</strong><small>${escapeHTML(r.period)} · 行程相關第 ${r.pages[0]}–${r.pages.at(-1)} 頁</small></button>`).join('')}</div><h2 class="section-title">🔎 搜尋 PDF 全文</h2><input id="search" class="search" placeholder="搜尋景點、日期或店家名稱" value="${escapeHTML(query)}"><div id="searchResults" class="results"></div>`}
function searchResults(){const el=$('searchResults');if(!el)return;document.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>choose(b.dataset.city));let q=query.trim().toLowerCase();if(!q){el.innerHTML='<p class="source-meta">搜尋後可直接跳到各城市的詳細內容，不需開 PDF。</p>';return}const found=DATA.pages.filter(p=>p.text.toLowerCase().includes(q)).slice(0,60);el.innerHTML=found.length?found.map(p=>{const i=p.text.toLowerCase().indexOf(q);const sn=p.text.slice(Math.max(0,i-55),i+145).replace(/\s+/g,' ');return `<button class="resultitem" data-page="${p.number}" style="display:block;width:100%;margin:8px 0;padding:10px;background:#eef6f9;border:1px solid #d1e7ef;border-radius:8px;text-align:left;color:#15445e"><strong>📄 第 ${p.number} 頁（前往完整內容）</strong><small style="display:block;margin-top:4px;color:#405e77">${escapeHTML(sn)}</small></button>`}).join(''):'<p class="source-meta">找不到符合的頁面。</p>';el.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.page);const region=DATA.regions.find(r=>r.pages.includes(n));if(region){choose(region.id);$('pdf-'+n)?.scrollIntoView({behavior:'smooth',block:'start'})}else{$('prepBtn').click()}})}
$('prepBtn').onclick=()=>{selected=null;renderHotspots();render();$('content').insertAdjacentHTML('afterbegin',`<section class="page-visible"><div class="head">🧳 行前準備｜PDF 第 1–2 頁</div><div class="raw">${toLinks(DATA.pages.filter(p=>p.number<=2).map(p=>p.text).join('\n\n'))}</div></section>`);if(mobile())$('panel').classList.add('open')};$('close').onclick=()=>$('panel').classList.remove('open');$('mobileOpen').onclick=()=>$('panel').classList.add('open');$('overview').onclick=()=>{selected=null;query='';renderHotspots();render();if(mobile())$('panel').classList.add('open')};$('searchBtn').onclick=()=>{if(!selected){render()}if(mobile())$('panel').classList.add('open');setTimeout(()=>{$('search')?.focus();$('search')?.scrollIntoView({behavior:'smooth',block:'center'})},50)};
fetch('itinerary.json').then(r=>{if(!r.ok)throw new Error('讀取失敗');return r.json()}).then(data=>{DATA=data;initializeLocations();renderHotspots();render()}).catch(e=>{$('content').innerHTML=`<p>無法載入行程資料：${escapeHTML(e.message)}。請透過 GitHub Pages 或本機 HTTP 伺服器開啟，不要直接使用 file://。</p>`});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('panel').classList.remove('open')});
</script>
</body></html>
